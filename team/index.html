<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연차 관리</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f2f2f7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.app {
  max-width: 420px;
  margin: 0 auto;
  padding: 16px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 4px 12px rgba(0,0,0,.06);
}

h2 {
  margin: 0;
  font-size: 18px;
}

.settings-btn {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 12px;
}

button.action {
  padding: 14px 0;
  border: none;
  border-radius: 14px;
  background: #007aff;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
}

button.gray {
  background: #8e8e93;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

select {
  padding: 6px 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.bar-wrap {
  background: #e5e5ea;
  border-radius: 12px;
  height: 24px;
  overflow: hidden;
  margin-bottom: 14px;
}

.bar {
  height: 100%;
  transition: width .3s;
}

.mandatory { background: #007aff; }
.cash { background: #34c759; }

ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

/* ⭐ 날짜 입력 박스 제거 (핵심 수정) */
li input[type="date"] {
  border: none;
  background: transparent;
  font-size: 14px;
  padding: 0;
  appearance: none;
  -webkit-appearance: none;
  outline: none;
  color: #333;
}

.delete {
  color: #ff3b30;
  font-size: 13px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.modal-content {
  background: #fff;
  width: 90%;
  max-width: 320px;
  border-radius: 18px;
  padding: 18px;
}

.modal-content h3 {
  margin: 0 0 14px;
}

.modal-content input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.save-btn { width: 160px; }
.reset-btn { width: 110px; }

/* ⭐ v1.6 추가 스타일 */
.small-note {
  font-size: 12px;
  color: #8e8e93;
  text-align: right;
  margin: -4px 0 10px;
  min-height: 14px;
}

.collapsible-header {
  cursor: pointer;
  user-select: none;
}

.toggle-icon {
  display: inline-block;
  transition: transform .2s;
  font-size: 16px;
  color: #8e8e93;
  margin-left: 4px;
}

.toggle-icon.open {
  transform: rotate(180deg);
}

.scheduled-summary {
  font-size: 13px;
  color: #8e8e93;
}

.add-row {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}

.add-row input[type="date"] {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 14px;
  background: #fff;
  appearance: auto;
  -webkit-appearance: auto;
}

.add-row select {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.add-row button {
  padding: 10px 14px;
  white-space: nowrap;
  font-size: 14px;
}

.collapsible-content {
  display: none;
}

.scheduled-empty {
  font-size: 13px;
  color: #8e8e93;
  padding: 8px 0;
}
</style>
</head>

<body>
<div class="app">

  <div class="card">
    <div class="row">
      <h2>연차 사용</h2>
      <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </div>
    <div class="buttons">
      <button class="action" onclick="useLeave(8)">연차 8시간</button>
      <button class="action" onclick="useLeave(7)">연차 7시간</button>
      <button class="action" onclick="useLeave(4)">반차 4시간</button>
      <button class="action" onclick="useLeave(2)">1/4차 2시간</button>
    </div>
  </div>

  <div class="card">
    <h2>연차 현황</h2>

    <div class="row"><span>사용한 연차</span><span id="used">0h</span></div>

    <div class="row"><span>남은 연차</span><span id="remaining">0h</span></div>
    <div class="small-note" id="remainingNote"></div>

    <div class="row"><span>필수 소진</span><span id="mandatoryLeft">0h</span></div>
    <div class="bar-wrap"><div class="bar mandatory" id="mandatoryBar"></div></div>

    <div class="row"><span>정산 가능</span><span id="cashLeft">0h</span></div>
    <div class="bar-wrap"><div class="bar cash" id="cashBar"></div></div>
  </div>

  <div class="card">
    <div class="row collapsible-header" onclick="toggleHistory()">
      <h2>사용 기록<span class="toggle-icon" id="historyToggleIcon">▾</span></h2>
      <span class="scheduled-summary" id="historySummary"></span>
      <select id="monthFilter" onclick="event.stopPropagation()" onchange="changeMonth(this.value)">
        <option value="all">전체</option>
      </select>
    </div>
    <div class="collapsible-content" id="historyContent">
      <ul id="history"></ul>
    </div>
  </div>

  <div class="card">
    <div class="row collapsible-header" onclick="toggleScheduled()">
      <h2>예정 연차<span class="toggle-icon" id="scheduledToggleIcon">▾</span></h2>
      <span class="scheduled-summary" id="scheduledSummary"></span>
    </div>
    <div class="collapsible-content" id="scheduledContent">
      <div class="add-row">
        <input type="date" id="scheduledDateInput">
        <select id="scheduledHourInput">
          <option value="8">8시간</option>
          <option value="7">7시간</option>
          <option value="4">4시간</option>
          <option value="2">2시간</option>
        </select>
        <button class="action" onclick="addScheduled()">추가</button>
      </div>
      <ul id="scheduledList"></ul>
      <div class="scheduled-empty" id="scheduledEmpty">등록된 예정 연차가 없습니다.</div>
    </div>
  </div>

</div>

<div class="modal" id="configModal">
  <div class="modal-content">
    <div class="row" style="margin-bottom:14px;">
      <h3 style="margin:0;">연차 설정</h3>
      <button class="settings-btn" onclick="closeSettings()">✕</button>
    </div>

    <input id="totalInput" type="number" placeholder="총 연차 시간 (예: 128)">
    <input id="mandatoryInput" type="number" placeholder="필수 소진 시간 (예: 86)">
    <input id="cashInput" type="number" placeholder="정산 가능 시간 (예: 42)">

    <div class="modal-actions">
      <button class="action gray reset-btn" onclick="resetAll()">초기화</button>
      <button class="action save-btn" onclick="saveConfig()">저장</button>
    </div>
  </div>
</div>

<script>
let config = JSON.parse(localStorage.getItem("leaveConfig"));
let records = JSON.parse(localStorage.getItem("leaveRecords") || "[]");
let scheduled = JSON.parse(localStorage.getItem("leaveScheduled") || "[]");
let selectedMonth = "all";
let scheduledOpen = false;
let historyOpen = true;

const usedEl = document.getElementById("used");
const remainingEl = document.getElementById("remaining");
const remainingNoteEl = document.getElementById("remainingNote");
const mandatoryLeftEl = document.getElementById("mandatoryLeft");
const cashLeftEl = document.getElementById("cashLeft");
const mandatoryBar = document.getElementById("mandatoryBar");
const cashBar = document.getElementById("cashBar");
const historyEl = document.getElementById("history");
const monthFilter = document.getElementById("monthFilter");
const historyContent = document.getElementById("historyContent");
const historyToggleIcon = document.getElementById("historyToggleIcon");
const historySummaryEl = document.getElementById("historySummary");
const scheduledContent = document.getElementById("scheduledContent");
const scheduledToggleIcon = document.getElementById("scheduledToggleIcon");
const scheduledSummaryEl = document.getElementById("scheduledSummary");
const scheduledListEl = document.getElementById("scheduledList");
const scheduledEmptyEl = document.getElementById("scheduledEmpty");

function today() {
  return new Date().toISOString().slice(0,10);
}

function openSettings() {
  document.getElementById("configModal").style.display = "flex";
}

function closeSettings() {
  document.getElementById("configModal").style.display = "none";
}

function saveConfig() {
  const t = +totalInput.value;
  const m = +mandatoryInput.value;
  const c = +cashInput.value;

  if (!t || !m || !c) {
    alert("모든 시간을 입력해주세요.");
    return;
  }

  config = { total:t, mandatory:m, cash:c };
  localStorage.setItem("leaveConfig", JSON.stringify(config));
  localStorage.setItem("leaveConfigured", "true");
  document.getElementById("configModal").style.display = "none";
  render();
}

function resetAll() {
  if (!confirm("모든 기록과 설정을 초기화할까요?")) return;
  localStorage.clear();
  location.reload();
}

function usedHours() {
  return records.reduce((a,b)=>a+b.hours,0);
}

function useLeave(h) {
  if (usedHours() + h > config.total) {
    alert("모든 연차가 소진되었습니다.");
    return;
  }
  records.push({ date: today(), hours: h });
  localStorage.setItem("leaveRecords", JSON.stringify(records));
  render();
}

function changeMonth(v) {
  selectedMonth = v;
  render();
}

/* ⭐ v1.7 추가: 사용 기록 접기/펼치기 (접혔을 때 요약, 펼쳤을 때 월별 필터 표시) */
function toggleHistory() {
  historyOpen = !historyOpen;
  historyContent.style.display = historyOpen ? "block" : "none";
  historyToggleIcon.classList.toggle("open", historyOpen);
  historySummaryEl.style.display = historyOpen ? "none" : "inline";
  monthFilter.style.display = historyOpen ? "inline-block" : "none";
}

/* ⭐ v1.6 추가: 예정 연차 관련 함수 */
function scheduledHours() {
  return scheduled.reduce((a,b)=>a+b.hours,0);
}

function toggleScheduled() {
  scheduledOpen = !scheduledOpen;
  scheduledContent.style.display = scheduledOpen ? "block" : "none";
  scheduledToggleIcon.classList.toggle("open", scheduledOpen);
}

function addScheduled() {
  const d = document.getElementById("scheduledDateInput").value;
  const h = +document.getElementById("scheduledHourInput").value;

  if (!d) {
    alert("예정 날짜를 선택해주세요.");
    return;
  }

  scheduled.push({ date: d, hours: h });
  scheduled.sort((a,b)=> a.date.localeCompare(b.date));
  localStorage.setItem("leaveScheduled", JSON.stringify(scheduled));
  document.getElementById("scheduledDateInput").value = "";
  renderScheduled();
}

function deleteScheduled(i) {
  scheduled.splice(i,1);
  localStorage.setItem("leaveScheduled", JSON.stringify(scheduled));
  renderScheduled();
}

function renderScheduled() {
  scheduledListEl.innerHTML = "";

  scheduled.forEach((s, i) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <span>${s.date}</span>
      <span>${s.hours}h</span>
      <span class="delete" onclick="deleteScheduled(${i})">삭제</span>
    `;
    scheduledListEl.appendChild(li);
  });

  scheduledEmptyEl.style.display = scheduled.length ? "none" : "block";
  scheduledSummaryEl.textContent = scheduled.length ? `총 ${scheduledHours()}h` : "";

  updateRemaining();
}

function updateRemaining() {
  if (!config) return;

  const used = usedHours();
  const remaining = Math.max(0, config.total - used);
  remainingEl.textContent = remaining + "h";

  if (scheduled.length) {
    const withScheduled = Math.max(0, remaining - scheduledHours());
    remainingNoteEl.textContent = `예정 반영 시 ${withScheduled}h`;
  } else {
    remainingNoteEl.textContent = "";
  }
}

function render() {
  if (!config) return;

  const used = usedHours();
  usedEl.textContent = used + "h";

  const mandatoryLeft = Math.max(0, config.mandatory - used);
  const cashLeft = Math.max(0, config.cash - Math.max(0, used - config.mandatory));

  mandatoryLeftEl.textContent = mandatoryLeft + "h";
  cashLeftEl.textContent = cashLeft + "h";

  mandatoryBar.style.width = (mandatoryLeft / config.mandatory * 100) + "%";
  cashBar.style.width = (cashLeft / config.cash * 100) + "%";

  if (monthFilter.options.length === 1) {
    [...new Set(records.map(r => r.date.slice(0,7)))].forEach(m => {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      monthFilter.appendChild(opt);
    });
  }

  historyEl.innerHTML = "";

  let filteredSum = 0;

  [...records].reverse().forEach((r, idx) => {
    const i = records.length - 1 - idx;

    if (selectedMonth !== "all" && !r.date.startsWith(selectedMonth)) return;

    filteredSum += r.hours;

    const li = document.createElement("li");
    li.innerHTML = `
      <input type="date" value="${r.date}"
        onchange="records[${i}].date=this.value;localStorage.setItem('leaveRecords',JSON.stringify(records))">
      <span>${r.hours}h</span>
      <span class="delete"
        onclick="records.splice(${i},1);localStorage.setItem('leaveRecords',JSON.stringify(records));render()">삭제</span>
    `;
    historyEl.appendChild(li);
  });

  historySummaryEl.textContent = `총 ${filteredSum}h`;

  monthFilter.value = selectedMonth;

  updateRemaining();
}

historyContent.style.display = historyOpen ? "block" : "none";
historyToggleIcon.classList.toggle("open", historyOpen);
historySummaryEl.style.display = historyOpen ? "none" : "inline";
monthFilter.style.display = historyOpen ? "inline-block" : "none";

render();
renderScheduled();

if (!localStorage.getItem("leaveConfigured")) {
  openSettings();
}
</script>
</body>
</html>
