<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오사카 여행">
<meta name="theme-color" content="#1C2B39">
<title>오사카 혼여행 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=Gowun+Dodum&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2B39;
    --ink-soft:#3C4E5E;
    --page:#FAF9F5;
    --paper:#FFFFFF;
    --paper-alt:#F4F2EC;
    --red:#B23A2F;
    --accent:#2C6E8C;
    --accent-soft:#DCE9EE;
    --sage:#5C7A5A;
    --sage-soft:#E1E8DE;
    --line:#E3E0D6;
    --muted:#8B8A80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page);
    color:var(--ink);
    font-family:'Gothic A1',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .round{ font-family:'Gowun Dodum',sans-serif; }

  /* ---------- HERO / BOARDING PASS ---------- */
  .hero{
    background:var(--ink);
    color:var(--paper);
    padding:calc(28px + env(safe-area-inset-top)) 20px 22px;
    position:relative;
  }
  .hero-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    max-width:640px; margin:0 auto;
  }
  .hero-title{
    font-family:'Gowun Dodum',sans-serif;
    font-weight:400;
    font-size:22px;
    letter-spacing:0.01em;
  }
  .hero-sub{
    margin-top:4px;
    font-size:12.5px;
    color:#C9CFD6;
  }
  .dday{
    text-align:right;
  }
  .dday-num{
    font-family:'Gowun Dodum',sans-serif;
    font-weight:400;
    font-size:26px;
    color:var(--accent);
    line-height:1;
    filter:brightness(1.35);
  }
  .dday-label{
    font-size:11px;
    color:#B8BEC6;
    margin-top:3px;
  }
  .route{
    max-width:640px; margin:22px auto 0;
    display:flex; align-items:center; justify-content:space-between;
  }
  .route-pt{ text-align:center; flex:0 0 auto; }
  .route-code{ font-family:'Noto Serif KR',serif; font-size:28px; font-weight:700; }
  .route-name{ font-size:11px; color:#B8BEC6; margin-top:2px; }
  .route-line{
    flex:1; margin:0 14px; position:relative; height:1px;
    background:repeating-linear-gradient(to right, #6B7A88 0 6px, transparent 6px 12px);
    top:-8px;
  }
  .route-line::after{
    content:"✈"; position:absolute; left:50%; top:-9px; transform:translateX(-50%);
    font-size:13px; color:var(--accent); filter:brightness(1.4);
  }
  .perf{
    max-width:640px; margin:20px auto 0; height:0; position:relative;
    border-top:1px dashed #4C5B6A;
  }
  .perf::before, .perf::after{
    content:""; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%;
    background:var(--page);
  }
  .perf::before{ left:-31px; }
  .perf::after{ right:-31px; }

  /* ---------- TABS ---------- */
  .tabbar{
    max-width:640px; margin:0 auto; display:flex; padding:14px 20px 0;
    gap:8px;
  }
  .tab{
    flex:1; text-align:center; padding:10px 6px; cursor:pointer;
    font-size:13.5px; font-weight:600; color:var(--muted);
    background:var(--paper-alt);
    border-radius:10px 10px 0 0;
    border:1px solid var(--line);
    border-bottom:none;
    transition:background .15s, color .15s;
  }
  .tab.active{
    background:var(--paper); color:var(--ink);
  }

  .content{
    max-width:640px; margin:0 auto; padding:0 20px 60px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:0 0 12px 12px;
    min-height:300px;
  }
  .panel{ display:none; padding-top:18px; }
  .panel.active{ display:block; }

  /* ---------- ITINERARY ---------- */
  .day-card{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .day-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:var(--paper-alt);
  }
  .day-date{
    font-family:'Gowun Dodum',serif; font-weight:400; font-size:17px;
  }
  .day-weekday{ font-size:11.5px; color:var(--muted); margin-top:2px;}
  .day-tag{
    font-size:11px; padding:4px 10px; border-radius:20px;
    background:var(--red); color:var(--paper); font-weight:600;
  }
  .day-tear{
    position:relative; height:0; border-top:1px dashed var(--line);
  }
  .day-tear::before, .day-tear::after{
    content:""; position:absolute; top:-9px; width:18px; height:18px; border-radius:50%;
    background:var(--page);
  }
  .day-tear::before{ left:-9px; }
  .day-tear::after{ right:-9px; }

  .items{ padding:6px 14px 12px; }
  .item{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 4px; border-bottom:1px solid #EFEADC;
  }
  .item:last-child{ border-bottom:none; }
  .item.done .item-activity{ text-decoration:line-through; color:var(--muted); }
  .item-check{
    margin-top:3px; width:18px; height:18px; flex:0 0 auto; cursor:pointer;
    accent-color:var(--sage);
  }
  .item-body{ flex:1; min-width:0; }
  .item-activity{
    border:none; background:transparent; font-size:14px; color:var(--ink);
    font-family:'Gothic A1',sans-serif; width:100%; padding:2px 0;
  }
  .item-activity:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .item-time-input{
    border:none; background:transparent; font-family:'Gowun Dodum',sans-serif;
    font-size:13px; font-weight:400; color:var(--accent); width:56px; padding-top:3px;
    filter:brightness(0.9);
  }
  .item-time-input:focus{ outline:none; }
  .item-del{
    border:none; background:none; color:var(--muted); cursor:pointer; font-size:15px;
    padding:2px 4px; flex:0 0 auto;
  }
  .item-del:hover{ color:var(--red); }
  .add-item{
    display:flex; align-items:center; gap:6px; padding:10px 4px 4px;
    font-size:13px; color:var(--muted); cursor:pointer; user-select:none;
  }
  .add-item:hover{ color:var(--red); }

  /* ---------- NOTES (비고) ---------- */
  .notes-card{
    border:1px dashed var(--line);
    border-radius:12px;
    padding:14px 16px 16px;
    margin-top:6px;
    background:var(--paper-alt);
  }
  .notes-head{
    font-family:'Gowun Dodum',sans-serif; font-size:15px; margin-bottom:4px;
  }

  /* ---------- BUDGET ---------- */
  .budget-summary{
    background:var(--ink); color:var(--paper); border-radius:12px; padding:18px;
    margin-bottom:16px;
  }
  .budget-summary-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .budget-total-label{ font-size:12px; color:#C9CFD6; }
  .budget-total-num{ font-family:'Gowun Dodum',sans-serif; font-size:24px; font-weight:400; }
  .budget-remain{ font-size:12px; color:#C9CFD6; margin-top:2px; }
  .bar-track{ height:8px; background:#3C4E5E; border-radius:6px; margin-top:12px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:6px; transition:width .3s; }
  .bar-fill.over{ background:var(--red); }

  .fixed-card{
    border:1px solid var(--accent-soft); border-radius:10px; padding:12px 16px; margin-bottom:14px;
    background:var(--accent-soft);
  }
  .fixed-head{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; }
  .fixed-head label{ display:flex; align-items:center; gap:8px; font-weight:600; }
  .fixed-head input[type=checkbox]{ width:17px;height:17px; accent-color:var(--accent); cursor:pointer; }
  .fixed-amt{
    width:64px; border:none; border-bottom:1px solid #B9CDD5; background:transparent;
    font-size:13px; text-align:right; font-family:'Gothic A1',sans-serif; color:var(--ink);
  }
  .fixed-amt:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .fixed-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; }

  .cat-card{
    border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px;
    background:var(--paper);
  }
  .cat-head{ display:flex; justify-content:space-between; align-items:center; }
  .cat-name{ font-weight:600; font-size:14px; }
  .cat-nums{ font-size:12.5px; color:var(--muted); }
  .cat-nums b{ color:var(--ink); }
  .cat-bar-track{ height:6px; background:var(--paper-alt); border-radius:6px; margin-top:8px; overflow:hidden; }
  .cat-bar-fill{ height:100%; background:var(--sage); }
  .cat-bar-fill.over{ background:var(--red); }
  .cat-plan-edit{
    width:70px; border:none; border-bottom:1px solid var(--line); background:transparent;
    font-size:12px; text-align:right; font-family:'Gothic A1',sans-serif; color:var(--ink);
  }
  .cat-plan-edit:focus{ outline:none; border-bottom:1px solid var(--accent); }

  .ledger-title{ font-size:13.5px; font-weight:700; margin:22px 0 10px; color:var(--ink-soft); }
  .ledger-form{
    display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;
  }
  .ledger-form select, .ledger-form input{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;
    font-family:'Gothic A1',sans-serif; background:var(--paper);
  }
  .ledger-form select{ flex:1 1 90px; }
  .ledger-form input[type=number]{ flex:1 1 80px; }
  .ledger-form input[type=text]{ flex:2 1 120px; }
  .ledger-form button{
    border:none; background:var(--ink); color:var(--paper); border-radius:8px;
    padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .ledger-form button:hover{ background:var(--red); }

  .ledger-item{
    display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid #EFEADC;
    font-size:13px;
  }
  .ledger-item .lcat{
    font-size:11px; padding:3px 8px; border-radius:20px; background:var(--sage-soft); color:var(--sage);
    font-weight:600; flex:0 0 auto;
  }
  .ledger-item .lmemo{ flex:1; color:var(--ink-soft); }
  .ledger-item .lamt{ font-family:'Gowun Dodum',sans-serif; font-weight:400; flex:0 0 auto; }
  .ledger-item .ldel{ border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px; }
  .ledger-item .ldel:hover{ color:var(--red); }
  .ledger-empty{ color:var(--muted); font-size:13px; padding:12px 2px; }

  /* ---------- CHECKLIST / SHOPPING shared rows ---------- */
  .check-row{
    display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid #EFEADC;
  }
  .check-row:last-of-type{ border-bottom:none; }
  .check-row input[type=checkbox]{ width:18px;height:18px; accent-color:var(--sage); cursor:pointer; flex:0 0 auto;}
  .check-row.done span{ text-decoration:line-through; color:var(--muted); }
  .check-row span{ flex:1; font-size:14px; }
  .check-del{ border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px; }
  .check-del:hover{ color:var(--red); }
  .add-check{ display:flex; gap:8px; margin-top:14px; }
  .add-check input{
    flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13.5px;
    font-family:'Gothic A1',sans-serif;
  }
  .add-check button{
    border:none; background:var(--ink); color:var(--paper); border-radius:8px;
    padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .add-check button:hover{ background:var(--red); }

  /* ---------- SHOPPING ---------- */
  .shop-summary{
    background:var(--ink); color:var(--paper); border-radius:12px; padding:16px 18px;
    margin-bottom:16px; display:flex; justify-content:space-between; gap:10px;
  }
  .shop-stat-label{ font-size:11.5px; color:#C9CFD6; }
  .shop-stat-num{ font-family:'Gowun Dodum',sans-serif; font-size:19px; margin-top:2px; }
  .shop-row .sprice{
    font-family:'Gowun Dodum',sans-serif; color:var(--accent); font-size:13px; flex:0 0 auto;
    filter:brightness(0.9);
  }
  .shop-form{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .shop-form input[type=text]{
    flex:2 1 140px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13.5px;
    font-family:'Gothic A1',sans-serif;
  }
  .shop-form input[type=number]{
    flex:1 1 80px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13.5px;
    font-family:'Gothic A1',sans-serif;
  }
  .shop-form button{
    border:none; background:var(--ink); color:var(--paper); border-radius:8px;
    padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .shop-form button:hover{ background:var(--red); }

  .section-label{
    font-family:'Gowun Dodum',sans-serif; font-weight:400; font-size:15px; margin:20px 0 8px;
    color:var(--ink);
  }
  .section-label:first-child{ margin-top:0; }

  .footer-note{
    max-width:640px; margin:14px auto 0; padding:0 20px;
    font-size:11.5px; color:var(--muted); text-align:center;
  }
  .reset-link{ color:var(--muted); text-decoration:underline; cursor:pointer; background:none;border:none;font-size:11.5px;font-family:inherit; }
  .reset-link:hover{ color:var(--red); }
  .save-badge{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:8px 16px; border-radius:20px;
    font-size:12px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
  }
  .save-badge.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:420px){
    .route-code{ font-size:22px; }
    .hero-title{ font-size:19px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div>
      <div class="hero-title">🇯🇵 오사카 혼여행</div>
      <div class="hero-sub" id="tripDateRange">11.20 – 11.24</div>
    </div>
    <div class="dday">
      <div class="dday-num" id="ddayNum">D-–</div>
      <div class="dday-label">여행까지</div>
    </div>
  </div>
  <div class="route">
    <div class="route-pt"><div class="route-code">ICN</div><div class="route-name">인천</div></div>
    <div class="route-line"></div>
    <div class="route-pt"><div class="route-code">KIX</div><div class="route-name">간사이</div></div>
  </div>
  <div class="perf"></div>
</div>

<div class="tabbar">
  <div class="tab active" data-tab="itinerary">일정</div>
  <div class="tab" data-tab="budget">가계부</div>
  <div class="tab" data-tab="shopping">쇼핑리스트</div>
</div>

<div class="content">
  <div class="panel active" id="panel-itinerary"></div>
  <div class="panel" id="panel-budget"></div>
  <div class="panel" id="panel-shopping"></div>
</div>

<div class="footer-note">
  이 기기에만 저장돼요 · <button class="reset-link" id="resetBtn">처음 계획으로 되돌리기</button>
</div>

<div class="save-badge" id="saveBadge">저장됨</div>

<script>
const STORAGE_KEY = 'osaka-trip-plan-v1';
const TRIP_YEAR = 2026;

function uid(){ return Math.random().toString(36).slice(2,10); }

const DEFAULT_DATA = {
  days: [
    { date:'11-20', title:'도착일', items:[
      {id:uid(), time:'08:00', text:'집에서 출발', done:false},
      {id:uid(), time:'09:00', text:'인천공항 도착 및 발렛', done:false},
      {id:uid(), time:'12:00', text:'인천 → 간사이 (비행)', done:false},
      {id:uid(), time:'13:50', text:'착륙 및 입국수속', done:false},
      {id:uid(), time:'16:00', text:'숙소 체크인 (웰리나 호텔 프리미어 오사카 난바)', done:false},
      {id:uid(), time:'18:00', text:'저녁식사 · 스키야키 호쿠토 (구글맵 예약)', done:false},
    ]},
    { date:'11-21', title:'우메다', items:[
      {id:uid(), time:'10:30', text:'숙소 외출 → 우메다 이동', done:false},
      {id:uid(), time:'11:30', text:'점심식사 · 키타스시 혼텐', done:false},
      {id:uid(), time:'12:30', text:'우메다 구경 (한큐백화점, 루쿠아백화점, 나가자키초, 하나다코 등) ~17:00', done:false},
      {id:uid(), time:'18:00', text:'숙소 들려서 짐 놓기', done:false},
      {id:uid(), time:'19:00', text:'저녁식사 · 규슈라멘 키오', done:false},
      {id:uid(), time:'21:00', text:'야식 · 스미야 코바코 (구글맵 예약)', done:false},
    ]},
    { date:'11-22', title:'난바', items:[
      {id:uid(), time:'11:30', text:'숙소 외출', done:false},
      {id:uid(), time:'12:00', text:'점심식사 · 츠케멘 스즈메', done:false},
      {id:uid(), time:'13:30', text:'난바 구경 (난바파크스, 도톤보리, 돈키호테, 칼디, 드럭스토어 등) ~18:00', done:false},
      {id:uid(), time:'19:00', text:'저녁식사 · 토미타 규카츠', done:false},
    ]},
    { date:'11-23', title:'해유관', items:[
      {id:uid(), time:'10:30', text:'숙소 외출', done:false},
      {id:uid(), time:'11:00', text:'점심식사', done:false},
      {id:uid(), time:'12:30', text:'해유관 이동 및 관람 ~15:30', done:false},
      {id:uid(), time:'16:00', text:'난바 복귀 및 숙소 들려서 짐 놓기', done:false},
      {id:uid(), time:'17:30', text:'저녁식사 · 모미지', done:false},
    ]},
    { date:'11-24', title:'출국일', items:[
      {id:uid(), time:'10:00', text:'숙소 체크아웃, 짐 맡기기', done:false},
      {id:uid(), time:'11:00', text:'점심식사 · 무기토 멘스케 (오픈런)', done:false},
      {id:uid(), time:'13:40', text:'숙소에서 짐 챙기기', done:false},
      {id:uid(), time:'14:00', text:'난바역 라피트 탑승 및 간사이공항 이동', done:false},
      {id:uid(), time:'14:40', text:'간사이공항 도착, 출국심사 및 면세', done:false},
      {id:uid(), time:'17:50', text:'간사이 → 인천 (비행)', done:false},
    ]},
  ],
  budgetPlan: { '식비+카페':30000, '쇼핑':30000, '비상금':15000 },
  transitCharge: { amount:3500, done:false },
  ledger: [],
  checklist: [
    {id:uid(), text:'e-sim 구매', done:false},
    {id:uid(), text:'여행자보험 가입', done:false},
    {id:uid(), text:'비짓재팬 등록', done:false},
    {id:uid(), text:'라피트 왕복 티켓 구매 (10월 경)', done:false},
    {id:uid(), text:'해유관 티켓 구매 (11/23 13:00 예약, 10월 경)', done:false},
    {id:uid(), text:'스키야키 호쿠토 구글맵 예약', done:false},
    {id:uid(), text:'스미야 코바코 구글맵 예약', done:false},
  ],
  shopping: []
};

let data = null;

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    data = raw ? JSON.parse(raw) : structuredClone(DEFAULT_DATA);
  }catch(e){
    data = structuredClone(DEFAULT_DATA);
  }
  // migrate older saved data to the current shape
  if(data.budgetPlan && ('교통비' in data.budgetPlan)) delete data.budgetPlan['교통비'];
  if(!data.transitCharge) data.transitCharge = { amount:3500, done:false };
  if(!data.shopping) data.shopping = [];
  renderAll();
}

let saveTimer = null;
function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    flashSaved();
  }catch(e){
    console.error('저장 실패', e);
  }
}
function flashSaved(){
  const b = document.getElementById('saveBadge');
  b.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>b.classList.remove('show'), 900);
}
function persist(){ saveData(); }

// ---------- HERO ----------
function renderHero(){
  const first = data.days[0].date, last = data.days[data.days.length-1].date;
  document.getElementById('tripDateRange').textContent =
    first.replace('-','.') + ' – ' + last.replace('-','.');

  const [m,d] = first.split('-').map(Number);
  const tripDate = new Date(TRIP_YEAR, m-1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((tripDate - today)/86400000);
  const ddayEl = document.getElementById('ddayNum');
  if(diff > 0) ddayEl.textContent = 'D-' + diff;
  else if(diff === 0) ddayEl.textContent = 'D-DAY';
  else ddayEl.textContent = 'D+' + Math.abs(diff);
}

const WEEKDAYS = ['일','월','화','수','목','금','토'];
function weekdayOf(dateStr){
  const [m,d] = dateStr.split('-').map(Number);
  return WEEKDAYS[new Date(TRIP_YEAR, m-1, d).getDay()] + '요일';
}

// ---------- ITINERARY (+ 비고 notes) ----------
function renderItinerary(){
  const el = document.getElementById('panel-itinerary');
  const daysHtml = data.days.map((day, di) => `
    <div class="day-card">
      <div class="day-head">
        <div>
          <div class="day-date">${day.date.replace('-','.')} <span style="color:var(--muted);font-weight:400;font-size:13px;">· ${day.title}</span></div>
          <div class="day-weekday">${weekdayOf(day.date)}</div>
        </div>
        <div class="day-tag">DAY ${di+1}</div>
      </div>
      <div class="day-tear"></div>
      <div class="items">
        ${day.items.map(item => `
          <div class="item ${item.done ? 'done' : ''}">
            <input type="checkbox" class="item-check" ${item.done?'checked':''}
              onchange="toggleItem(${di},'${item.id}')">
            <input class="item-time-input" value="${item.time}" data-day="${di}" data-id="${item.id}" data-field="time" onchange="editItem(event)">
            <div class="item-body">
              <input class="item-activity" value="${escapeAttr(item.text)}" data-day="${di}" data-id="${item.id}" data-field="text" onchange="editItem(event)">
            </div>
            <button class="item-del" onclick="deleteItem(${di},'${item.id}')">✕</button>
          </div>
        `).join('')}
        <div class="add-item" onclick="addItem(${di})">＋ 일정 추가</div>
      </div>
    </div>
  `).join('');

  const notesHtml = `
    <div class="notes-card">
      <div class="notes-head round">✎ 비고</div>
      ${data.checklist.map(c=>`
        <div class="check-row ${c.done?'done':''}">
          <input type="checkbox" ${c.done?'checked':''} onchange="toggleCheck('${c.id}')">
          <span>${escapeAttr(c.text)}</span>
          <button class="check-del" onclick="deleteCheck('${c.id}')">✕</button>
        </div>
      `).join('')}
      <div class="add-check">
        <input id="new-check" type="text" placeholder="비고 추가">
        <button onclick="addCheck()">추가</button>
      </div>
    </div>
  `;

  el.innerHTML = daysHtml + notesHtml;

  const newCheckInput = document.getElementById('new-check');
  if(newCheckInput){
    newCheckInput.addEventListener('keydown', e=>{ if(e.key==='Enter') addCheck(); });
  }
}
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

function toggleItem(dayIdx, id){
  const item = data.days[dayIdx].items.find(i=>i.id===id);
  item.done = !item.done;
  persist(); renderItinerary();
}
function editItem(e){
  const {day, id, field} = e.target.dataset;
  const item = data.days[day].items.find(i=>i.id===id);
  item[field] = e.target.value;
  persist();
}
function deleteItem(dayIdx, id){
  data.days[dayIdx].items = data.days[dayIdx].items.filter(i=>i.id!==id);
  persist(); renderItinerary();
}
function addItem(dayIdx){
  data.days[dayIdx].items.push({id:uid(), time:'00:00', text:'새 일정', done:false});
  persist(); renderItinerary();
}

// notes (비고) — reuse data.checklist
function toggleCheck(id){
  const c = data.checklist.find(c=>c.id===id);
  c.done = !c.done;
  persist(); renderItinerary();
}
function deleteCheck(id){
  data.checklist = data.checklist.filter(c=>c.id!==id);
  persist(); renderItinerary();
}
function addCheck(){
  const input = document.getElementById('new-check');
  const val = input.value.trim();
  if(!val) return;
  data.checklist.push({id:uid(), text:val, done:false});
  persist(); renderItinerary();
}

// ---------- BUDGET ----------
function renderBudget(){
  const el = document.getElementById('panel-budget');
  const cats = Object.keys(data.budgetPlan);
  const totalPlan = cats.reduce((s,c)=>s+Number(data.budgetPlan[c]||0),0);
  const spentByCat = {};
  cats.forEach(c=>spentByCat[c]=0);
  data.ledger.forEach(l=>{ if(spentByCat[l.category]!==undefined) spentByCat[l.category]+=Number(l.amount); });
  const totalSpent = Object.values(spentByCat).reduce((a,b)=>a+b,0);
  const totalPct = totalPlan ? Math.min(100, Math.round(totalSpent/totalPlan*100)) : 0;
  const remain = totalPlan - totalSpent;

  el.innerHTML = `
    <div class="budget-summary">
      <div class="budget-summary-row">
        <span class="budget-total-label">총 지출</span>
        <span class="budget-total-num">¥${totalSpent.toLocaleString()}</span>
      </div>
      <div class="budget-remain">예산 ¥${totalPlan.toLocaleString()} 중 ${remain>=0 ? '¥'+remain.toLocaleString()+' 남음' : '¥'+Math.abs(remain).toLocaleString()+' 초과'}</div>
      <div class="bar-track"><div class="bar-fill ${totalSpent>totalPlan?'over':''}" style="width:${totalPct}%"></div></div>
    </div>

    <div class="fixed-card">
      <div class="fixed-head">
        <label><input type="checkbox" ${data.transitCharge.done?'checked':''} onchange="toggleTransit()"> 교통카드 충전</label>
        <span>¥<input class="fixed-amt" type="number" value="${data.transitCharge.amount}" onchange="editTransit(event)"></span>
      </div>
      <div class="fixed-sub">첫날 도착 후 바로 충전하는 정액 지출이라 위 예산 합계에는 포함하지 않았어요.</div>
    </div>

    <div class="section-label">카테고리별 예산</div>
    ${cats.map(c=>{
      const plan = Number(data.budgetPlan[c]||0);
      const spent = spentByCat[c]||0;
      const pct = plan ? Math.min(100, Math.round(spent/plan*100)) : 0;
      return `
      <div class="cat-card">
        <div class="cat-head">
          <span class="cat-name">${c}</span>
          <span class="cat-nums"><b>¥${spent.toLocaleString()}</b> / <input class="cat-plan-edit" type="number" value="${plan}" data-cat="${c}" onchange="editPlan(event)">엔</span>
        </div>
        <div class="cat-bar-track"><div class="cat-bar-fill ${spent>plan?'over':''}" style="width:${pct}%"></div></div>
      </div>`;
    }).join('')}

    <div class="ledger-title">지출 내역 추가</div>
    <div class="ledger-form">
      <select id="lf-cat">${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      <input id="lf-amt" type="number" placeholder="금액(엔)">
      <input id="lf-memo" type="text" placeholder="메모 (선택)">
      <button onclick="addLedger()">추가</button>
    </div>

    <div class="ledger-title">지출 목록</div>
    ${data.ledger.length===0 ? '<div class="ledger-empty">아직 기록된 지출이 없어요.</div>' :
      [...data.ledger].reverse().map(l=>`
        <div class="ledger-item">
          <span class="lcat">${l.category}</span>
          <span class="lmemo">${l.memo ? escapeAttr(l.memo) : ''}</span>
          <span class="lamt">¥${Number(l.amount).toLocaleString()}</span>
          <button class="ldel" onclick="deleteLedger('${l.id}')">✕</button>
        </div>
      `).join('')
    }
  `;
}
function editPlan(e){
  const cat = e.target.dataset.cat;
  data.budgetPlan[cat] = Number(e.target.value)||0;
  persist(); renderBudget();
}
function addLedger(){
  const cat = document.getElementById('lf-cat').value;
  const amt = Number(document.getElementById('lf-amt').value);
  const memo = document.getElementById('lf-memo').value.trim();
  if(!amt || amt<=0) return;
  data.ledger.push({id:uid(), category:cat, amount:amt, memo});
  persist(); renderBudget();
}
function deleteLedger(id){
  data.ledger = data.ledger.filter(l=>l.id!==id);
  persist(); renderBudget();
}
function toggleTransit(){
  data.transitCharge.done = !data.transitCharge.done;
  persist(); renderBudget();
}
function editTransit(e){
  data.transitCharge.amount = Number(e.target.value)||0;
  persist(); renderBudget();
}

// ---------- SHOPPING LIST ----------
function renderShopping(){
  const el = document.getElementById('panel-shopping');
  const totalAll = data.shopping.reduce((s,i)=>s+Number(i.price||0),0);
  const totalDone = data.shopping.filter(i=>i.done).reduce((s,i)=>s+Number(i.price||0),0);
  const shopBudget = data.budgetPlan['쇼핑'];

  el.innerHTML = `
    <div class="shop-summary">
      <div>
        <div class="shop-stat-label">예상 총액</div>
        <div class="shop-stat-num">¥${totalAll.toLocaleString()}</div>
      </div>
      <div>
        <div class="shop-stat-label">구매 완료</div>
        <div class="shop-stat-num">¥${totalDone.toLocaleString()}</div>
      </div>
      <div>
        <div class="shop-stat-label">쇼핑 예산</div>
        <div class="shop-stat-num">¥${Number(shopBudget||0).toLocaleString()}</div>
      </div>
    </div>

    ${data.shopping.length===0 ? '<div class="ledger-empty">아직 담은 품목이 없어요. 사고 싶은 걸 적어보세요.</div>' :
      data.shopping.map(i=>`
        <div class="check-row shop-row ${i.done?'done':''}">
          <input type="checkbox" ${i.done?'checked':''} onchange="toggleShop('${i.id}')">
          <span>${escapeAttr(i.text)}</span>
          ${i.price ? `<span class="sprice">¥${Number(i.price).toLocaleString()}</span>` : ''}
          <button class="check-del" onclick="deleteShop('${i.id}')">✕</button>
        </div>
      `).join('')
    }

    <div class="shop-form">
      <input id="shop-name" type="text" placeholder="품목 (예: 돈키호테 과자)">
      <input id="shop-price" type="number" placeholder="예상 금액(선택)">
      <button onclick="addShop()">추가</button>
    </div>
  `;
  const nameInput = document.getElementById('shop-name');
  nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') addShop(); });
}
function toggleShop(id){
  const i = data.shopping.find(i=>i.id===id);
  i.done = !i.done;
  persist(); renderShopping();
}
function deleteShop(id){
  data.shopping = data.shopping.filter(i=>i.id!==id);
  persist(); renderShopping();
}
function addShop(){
  const name = document.getElementById('shop-name').value.trim();
  const priceRaw = document.getElementById('shop-price').value;
  if(!name) return;
  data.shopping.push({id:uid(), text:name, price: priceRaw ? Number(priceRaw) : null, done:false});
  persist(); renderShopping();
}

// ---------- TABS ----------
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
  });
});

// ---------- RESET ----------
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('처음 계획으로 되돌릴까요? 지금까지 수정한 내용과 지출, 쇼핑리스트가 모두 사라져요.')) return;
  data = structuredClone(DEFAULT_DATA);
  saveData();
  renderAll();
});

function renderAll(){
  renderHero();
  renderItinerary();
  renderBudget();
  renderShopping();
}

loadData();
</script>
</body>
</html>
